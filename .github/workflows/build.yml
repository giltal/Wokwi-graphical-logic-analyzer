name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wokwi's own toolchain image, so the binary matches what wokwi.com builds.
      - name: Build the wasm
        run: |
          docker run --rm -u $(id -u):$(id -g) -v ${{ github.workspace }}:/src \
            wokwi/builder-clang-wasm:latest \
            make -C chip dist/logic-scope.chip.wasm dist/logic-scope.chip.json

      # Single-file source for wokwi.com, which compiles one C file per chip.
      - name: Amalgamate the sources
        run: node chip/tools/amalgamate.js

      - name: Check the wasm fits the simulator's initial memory
        run: node chip/tools/check-memory.js

      - uses: actions/upload-artifact@v4
        with:
          name: logic-scope-chip
          path: |
            chip/dist/logic-scope.chip.wasm
            chip/dist/logic-scope.chip.json
            chip/dist/logic-scope.chip.c

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chip/dist/logic-scope.chip.wasm
            chip/dist/logic-scope.chip.json
            chip/dist/logic-scope.chip.c
